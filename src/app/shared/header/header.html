<nz-layout>

  <!-- ================= Top Contact Bar ================= -->

  <nz-header class="top-header">

    <div
      nz-row
      nzJustify="space-between"
      nzAlign="middle">

      <!-- Contact Details -->

      <div class="left-section">

        <span class="email-contact">
          <span
            nz-icon
            nzType="mail">
          </span>

          hometechmodulars@gmail.com
        </span>

        <span class="divider"></span>

        <span>
          <span
            nz-icon
            nzType="phone">
          </span>

          99160-27283
        </span>

      </div>


      <!-- WhatsApp -->

      <div class="right-section">

        <a
          href="#"
          aria-label="WhatsApp">

          <span
            nz-icon
            nzType="whats-app"
            nzTheme="outline">
          </span>

        </a>

      </div>

    </div>

  </nz-header>


  <!-- ================= Main Navigation ================= -->

  <nz-header class="main-header">

    <div
      nz-row
      nzAlign="middle"
      class="main-header-row">


      <!-- Logo -->

      <div
        nz-col
        nzSpan="6"
        class="logo-col">

        <img
          src="assets/Images/HeaderImages/HomeTechLogo.jpg"
          alt="HomeTech Logo"
          class="logo">

      </div>


      <!-- Menu -->

      <div
        nz-col
        nzSpan="18"
        class="menu-col">

        <ul
          nz-menu
          nzMode="horizontal"
          class="menu">

          <li nz-menu-item>
            <a href="#about-us">
              About Us
            </a>
          </li>

          <li nz-menu-item>
            <a href="#gallery">
              Gallery
            </a>
          </li>

          <li nz-menu-item>
            <a href="#services">
              Services
            </a>
          </li>

          <li nz-menu-item>
            <a href="#blogs">
              Blogs
            </a>
          </li>

          <li nz-menu-item>
            <a href="#contact-us">
              Contact Us
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nz-header>

</nz-layout>


<!-- ================= Hero Carousel ================= -->

<nz-carousel
  nzAutoPlay
  [nzAutoPlaySpeed]="5000"
  nzEffect="scrollx">

  <div
    nz-carousel-content
    *ngFor="let slide of slides">

    <div class="hero-slide">


      <!-- Hero Image -->

      <img
        [src]="slide.image"
        [alt]="slide.title"
        class="hero-image">


      <!-- Dark Overlay -->

      <div class="overlay"></div>


      <!-- Hero Content -->

      <div class="hero-content">

        <h1>
          {{ slide.title }}
        </h1>

        <p>
          {{ slide.subtitle }}
        </p>


        <!-- Hero Button -->

        <a
          href="#gallery"
          class="hero-btn">

          {{ slide.button }}

        </a>

      </div>

    </div>

  </div>

</nz-carousel>
